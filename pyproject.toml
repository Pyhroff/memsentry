[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memsentry"
version = "1.2.0"
description = "Static scanner for injected instructions in agent memory/context files."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agent memory", "prompt injection", "context files", "security scanner", "LLM agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/Pyhroff/memsentry"
Issues = "https://github.com/Pyhroff/memsentry/issues"
Changelog = "https://github.com/Pyhroff/memsentry/blob/main/CHANGELOG.md"

[project.scripts]
memsentry = "memsentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memsentry"]
