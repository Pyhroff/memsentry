[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memsentry"
version = "1.1.0"
description = "Static scanner for injected instructions in agent memory/context files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
memsentry = "memsentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memsentry"]
