name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  cross-repo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memsentry

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pyhroff/agent-test-range
          path: agent-test-range
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pyhroff/mcpaudit
          path: mcpaudit
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pyhroff/ragsentry
          path: ragsentry
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install this commit's memsentry alongside the other two scanners
        run: |
          pip install -e memsentry -e mcpaudit -e ragsentry

      - name: Run agent-test-range's regression harness against this commit
        run: |
          cd agent-test-range
          python3 scripts/run_range.py
